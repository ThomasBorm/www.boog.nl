
<style>
/* General website styling */
body,
h1,
h2,
h3,
h4,
h5 {
  font-family: "Poppins", sans-serif;
}

body {
  font-size: 16px;
}

/* Photo gallery */
.photo-grid {
  column-count: 2;
  column-gap: 16px;
}

.photo-grid img {
  display: block;
  width: 100%;
  margin-top: 16px;
  opacity: 0.8;
  cursor: pointer;
}

.photo-grid img:hover {
  opacity: 1;
}

/* Image popup */
dialog {
  border: 0;
  padding: 0;
  width: min(900px, 90%);
}

dialog::backdrop {
  background: rgba(0, 0, 0, 0.85);
}

/* Fixed white header */
.sticky-header {
  position: fixed;
  top: 0;
  left: 200px;
  right: 0;
  z-index: 5;
  background: #ffffff;
  padding: 12px 40px;
  box-shadow: 0 2px 5px rgba(0, 0, 0, 0.08);
  display: flex;
  align-items: center;
  min-height: 60px;
}

/* Header text */
.sticky-header span {
  font-family: "Poppins", sans-serif;
  font-size: 24px;
  font-weight: bold;
  color: #000000;
}

/* Header menu button */
.sticky-header .w3-button {
  background: #ffffff;
  color: #000000;
}

/* Responsive layout for tablets and mobile */
@media (max-width: 992px) {
  .sticky-header {
    left: 0;
    padding: 8px 16px;
    min-height: 56px;
  }

  .sticky-header span {
    font-size: 18px;
  }
}

/* Single-column photo gallery on mobile */
@media (max-width: 600px) {
  .photo-grid {
    column-count: 1;
  }
}
</style>
